<svg xmlns="http://www.w3.org/2000/svg" width="920" height="670" viewBox="0 0 920 670">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <style>
  .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
  .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
  .label { font: 700 15px Arial, sans-serif; fill: #111827; }
  .small { font: 400 13px Arial, sans-serif; fill: #374151; }
  .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
  .mono { font: 600 13px Consolas, Menlo, monospace; fill: #111827; }
  .box { stroke: #374151; stroke-width: 1.6; rx: 12; ry: 12; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 6 5; }
</style>
</defs>
<rect x="0" y="0" width="920" height="670" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Hình 1 — Bố cục cơ bản của ELF file</text>
<text x="40" y="68" class="subtitle" text-anchor="start">ELF Header trỏ tới Program Header Table và Section Header Table bằng offset trong file.</text>
<rect x="80" y="110" width="760" height="70" class="box" fill="#dbeafe"/>
<text x="460.0" y="138" class="label" text-anchor="middle">ELF Header</text>
<text x="460.0" y="160" class="tiny" text-anchor="middle">e_ident, e_type, e_entry, e_phoff, e_shoff</text>
<rect x="80" y="190" width="760" height="70" class="box" fill="#dcfce7"/>
<text x="460.0" y="218" class="label" text-anchor="middle">Program Header Table</text>
<text x="460.0" y="240" class="tiny" text-anchor="middle">Danh sách segment cho loader</text>
<rect x="80" y="270" width="760" height="70" class="box" fill="#f3f4f6"/>
<text x="460.0" y="298" class="label" text-anchor="middle">.text / .rodata</text>
<text x="460.0" y="320" class="tiny" text-anchor="middle">code + dữ liệu read-only</text>
<rect x="80" y="350" width="760" height="70" class="box" fill="#ffedd5"/>
<text x="460.0" y="378" class="label" text-anchor="middle">.data / .bss</text>
<text x="460.0" y="400" class="tiny" text-anchor="middle">dữ liệu writable</text>
<rect x="80" y="430" width="760" height="70" class="box" fill="#ede9fe"/>
<text x="460.0" y="458" class="label" text-anchor="middle">.dynamic / .got / .plt</text>
<text x="460.0" y="480" class="tiny" text-anchor="middle">dynamic linking metadata</text>
<rect x="80" y="510" width="760" height="70" class="box" fill="#fee2e2"/>
<text x="460.0" y="538" class="label" text-anchor="middle">Section Header Table</text>
<text x="460.0" y="560" class="tiny" text-anchor="middle">Danh sách section cho linker/debugger</text>
<path d="M220,153 L220,197" class="arrow"/>
<text x="230" y="183" class="mono" text-anchor="start">e_phoff</text>
<path d="M650,153 L650,597" class="arrow"/>
<text x="660" y="395" class="mono" text-anchor="start">e_shoff</text>
<text x="80" y="636" class="small" text-anchor="start">Ghi nhớ: Program Header phục vụ khi chạy chương trình; Section Header chủ yếu phục vụ link/debug/phân tích.</text>
</svg>
