<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <style>
  .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
  .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
  .label { font: 700 15px Arial, sans-serif; fill: #111827; }
  .small { font: 400 13px Arial, sans-serif; fill: #374151; }
  .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
  .mono { font: 600 13px Consolas, Menlo, monospace; fill: #111827; }
  .box { stroke: #374151; stroke-width: 1.6; rx: 12; ry: 12; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 6 5; }
</style>
</defs>
<rect x="0" y="0" width="960" height="630" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Hình 3 — Các trường quan trọng trong ELF Header (`Ehdr`)</text>
<text x="40" y="68" class="subtitle" text-anchor="start">`Ehdr` nằm ngay đầu file và đóng vai trò như “mục lục” cấp cao của ELF.</text>
<rect x="90" y="115" width="350" height="68" class="box" fill="#dbeafe"/>
<text x="265.0" y="143" class="label" text-anchor="middle">e_ident</text>
<text x="265.0" y="165" class="tiny" text-anchor="middle">Magic: 7F 45 4C 46, class 32/64-bit, endian</text>
<rect x="90" y="207" width="350" height="68" class="box" fill="#dcfce7"/>
<text x="265.0" y="235" class="label" text-anchor="middle">e_type</text>
<text x="265.0" y="257" class="tiny" text-anchor="middle">Loại file: ET_REL / ET_EXEC / ET_DYN / ET_CORE</text>
<rect x="90" y="299" width="350" height="68" class="box" fill="#ffedd5"/>
<text x="265.0" y="327" class="label" text-anchor="middle">e_machine</text>
<text x="265.0" y="349" class="tiny" text-anchor="middle">Kiến trúc: EM_X86_64, EM_ARM, EM_AARCH64...</text>
<rect x="90" y="391" width="350" height="68" class="box" fill="#ede9fe"/>
<text x="265.0" y="419" class="label" text-anchor="middle">e_entry</text>
<text x="265.0" y="441" class="tiny" text-anchor="middle">Virtual address bắt đầu chạy chương trình</text>
<rect x="515" y="115" width="350" height="68" class="box" fill="#dbeafe"/>
<text x="690.0" y="143" class="label" text-anchor="middle">e_phoff</text>
<text x="690.0" y="165" class="tiny" text-anchor="middle">File offset tới Program Header Table</text>
<rect x="515" y="207" width="350" height="68" class="box" fill="#dcfce7"/>
<text x="690.0" y="235" class="label" text-anchor="middle">e_shoff</text>
<text x="690.0" y="257" class="tiny" text-anchor="middle">File offset tới Section Header Table</text>
<rect x="515" y="299" width="350" height="68" class="box" fill="#ffedd5"/>
<text x="690.0" y="327" class="label" text-anchor="middle">e_phnum / e_shnum</text>
<text x="690.0" y="349" class="tiny" text-anchor="middle">Số entry trong Program/Section Header Table</text>
<rect x="360" y="505" width="270" height="70" class="box" fill="#fee2e2"/>
<text x="495.0" y="533" class="label" text-anchor="middle">Lưu ý quan trọng</text>
<text x="495.0" y="555" class="tiny" text-anchor="middle">offset ≠ virtual address</text>
<path d="M340,397 L430,505" class="arrow"/>
<path d="M620,305 L540,505" class="arrow"/>
</svg>
