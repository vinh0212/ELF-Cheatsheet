<svg xmlns="http://www.w3.org/2000/svg" width="940" height="570" viewBox="0 0 940 570">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <style>
  .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
  .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
  .label { font: 700 15px Arial, sans-serif; fill: #111827; }
  .small { font: 400 13px Arial, sans-serif; fill: #374151; }
  .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
  .mono { font: 600 13px Consolas, Menlo, monospace; fill: #111827; }
  .box { stroke: #374151; stroke-width: 1.6; rx: 12; ry: 12; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 6 5; }
</style>
</defs>
<rect x="0" y="0" width="940" height="570" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Hình 4 — Section vs Segment</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Section là góc nhìn của linker/debugger; segment là góc nhìn của loader khi map vào memory.</text>
<text x="120" y="118" class="label" text-anchor="start">Sections trong file</text>
<rect x="80" y="145" width="240" height="38" class="box" fill="#fef3c7"/>
<text x="200.0" y="173" class="label" text-anchor="middle">.interp</text>
<rect x="80" y="193" width="240" height="38" class="box" fill="#dbeafe"/>
<text x="200.0" y="221" class="label" text-anchor="middle">.text</text>
<rect x="80" y="241" width="240" height="38" class="box" fill="#cffafe"/>
<text x="200.0" y="269" class="label" text-anchor="middle">.rodata</text>
<rect x="80" y="289" width="240" height="38" class="box" fill="#ffedd5"/>
<text x="200.0" y="317" class="label" text-anchor="middle">.data</text>
<rect x="80" y="337" width="240" height="38" class="box" fill="#e5e7eb"/>
<text x="200.0" y="365" class="label" text-anchor="middle">.bss</text>
<rect x="80" y="385" width="240" height="38" class="box" fill="#ede9fe"/>
<text x="200.0" y="413" class="label" text-anchor="middle">.dynamic</text>
<rect x="80" y="433" width="240" height="38" class="box" fill="#fee2e2"/>
<text x="200.0" y="461" class="label" text-anchor="middle">.shstrtab</text>
<text x="615" y="118" class="label" text-anchor="start">Segments để loader map</text>
<rect x="560" y="145" width="300" height="58" class="box" fill="#fef3c7"/>
<text x="710.0" y="173" class="label" text-anchor="middle">PT_INTERP</text>
<text x="710.0" y="195" class="tiny" text-anchor="middle">chứa đường dẫn dynamic linker</text>
<path d="M320,164 L560,174" class="arrow"/>
<rect x="560" y="227" width="300" height="58" class="box" fill="#bfdbfe"/>
<text x="710.0" y="255" class="label" text-anchor="middle">PT_LOAD R-X</text>
<text x="710.0" y="277" class="tiny" text-anchor="middle">gom .text + .rodata</text>
<path d="M320,212 L560,256" class="arrow"/>
<path d="M320,260 L560,256" class="arrow"/>
<rect x="560" y="309" width="300" height="58" class="box" fill="#fed7aa"/>
<text x="710.0" y="337" class="label" text-anchor="middle">PT_LOAD RW-</text>
<text x="710.0" y="359" class="tiny" text-anchor="middle">gom .data + .bss</text>
<path d="M320,308 L560,338" class="arrow"/>
<path d="M320,356 L560,338" class="arrow"/>
<rect x="560" y="391" width="300" height="58" class="box" fill="#ddd6fe"/>
<text x="710.0" y="419" class="label" text-anchor="middle">PT_DYNAMIC</text>
<text x="710.0" y="441" class="tiny" text-anchor="middle">gom dynamic metadata</text>
<path d="M320,404 L560,420" class="arrow"/>
<text x="80" y="515" class="small" text-anchor="start">Một segment có thể chứa nhiều section. Một số section như `.shstrtab` không cần được load vào memory.</text>
</svg>
