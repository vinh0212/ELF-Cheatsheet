<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <style>
  .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
  .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
  .label { font: 700 15px Arial, sans-serif; fill: #111827; }
  .small { font: 400 13px Arial, sans-serif; fill: #374151; }
  .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
  .mono { font: 600 13px Consolas, Menlo, monospace; fill: #111827; }
  .box { stroke: #374151; stroke-width: 1.6; rx: 12; ry: 12; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 6 5; }
</style>
</defs>
<rect x="0" y="0" width="900" height="530" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Hình 5 — Dynamic Linking, PLT và GOT</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Lần gọi đầu có thể đi qua dynamic linker để resolve địa chỉ thật của hàm trong shared library.</text>
<rect x="60" y="150" width="190" height="90" class="box" fill="#dbeafe"/>
<text x="155.0" y="178" class="label" text-anchor="middle">Program code</text>
<text x="155.0" y="200" class="tiny" text-anchor="middle">call printf@plt</text>
<rect x="330" y="150" width="190" height="90" class="box" fill="#dcfce7"/>
<text x="425.0" y="178" class="label" text-anchor="middle">.plt</text>
<text x="425.0" y="200" class="tiny" text-anchor="middle">stub/trampoline</text>
<rect x="600" y="150" width="190" height="90" class="box" fill="#ffedd5"/>
<text x="695.0" y="178" class="label" text-anchor="middle">.got.plt</text>
<text x="695.0" y="200" class="tiny" text-anchor="middle">ô chứa địa chỉ hàm</text>
<rect x="330" y="330" width="190" height="90" class="box" fill="#ede9fe"/>
<text x="425.0" y="358" class="label" text-anchor="middle">dynamic linker</text>
<text x="425.0" y="380" class="tiny" text-anchor="middle">ld-linux resolves symbol</text>
<rect x="600" y="330" width="190" height="90" class="box" fill="#fee2e2"/>
<text x="695.0" y="358" class="label" text-anchor="middle">libc.so</text>
<text x="695.0" y="380" class="tiny" text-anchor="middle">printf thật</text>
<path d="M250,195 L330,195" class="arrow"/>
<path d="M520,195 L600,195" class="arrow"/>
<path d="M695,240 L430,330" class="arrow"/>
<path d="M520,375 L600,375" class="arrow"/>
<path d="M695,330 L695,240" class="arrow"/>
<text x="70" y="285" class="small" text-anchor="start">1) Program gọi `printf@plt`</text>
<text x="335" y="285" class="small" text-anchor="start">2) PLT đọc địa chỉ trong GOT</text>
<text x="545" y="285" class="small" text-anchor="start">3) Nếu chưa resolve → gọi dynamic linker</text>
<text x="560" y="465" class="small" text-anchor="start">4) GOT được patch để lần sau nhảy thẳng tới `printf` trong libc</text>
</svg>
