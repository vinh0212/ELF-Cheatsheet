<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <style>
  .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
  .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
  .label { font: 700 15px Arial, sans-serif; fill: #111827; }
  .small { font: 400 13px Arial, sans-serif; fill: #374151; }
  .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
  .mono { font: 600 13px Consolas, Menlo, monospace; fill: #111827; }
  .box { stroke: #374151; stroke-width: 1.6; rx: 12; ry: 12; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 6 5; }
</style>
</defs>
<rect x="0" y="0" width="900" height="550" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Hình 6 — Relocation: vá địa chỉ/symbol trước khi chạy đúng</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Relocation entry cho linker/loader biết cần sửa byte nào, sửa theo symbol nào và kiểu sửa ra sao.</text>
<rect x="65" y="150" width="210" height="100" class="box" fill="#dbeafe"/>
<text x="170.0" y="178" class="label" text-anchor="middle">Relocation entry</text>
<text x="170.0" y="200" class="tiny" text-anchor="middle">r_offset: sửa ở đâu</text>
<text x="170.0" y="217" class="tiny" text-anchor="middle">r_info: symbol + type</text>
<text x="170.0" y="234" class="tiny" text-anchor="middle">r_addend: cộng thêm</text>
<rect x="345" y="140" width="210" height="120" class="box" fill="#dcfce7"/>
<text x="450.0" y="168" class="label" text-anchor="middle">Symbol table</text>
<text x="450.0" y="190" class="tiny" text-anchor="middle">printf</text>
<text x="450.0" y="207" class="tiny" text-anchor="middle">global_var</text>
<text x="450.0" y="224" class="tiny" text-anchor="middle">main</text>
<rect x="625" y="150" width="210" height="100" class="box" fill="#ffedd5"/>
<text x="730.0" y="178" class="label" text-anchor="middle">Target bytes</text>
<text x="730.0" y="200" class="tiny" text-anchor="middle">call ???</text>
<text x="730.0" y="217" class="tiny" text-anchor="middle">mov ???</text>
<path d="M275,200 L345,200" class="arrow"/>
<path d="M555,200 L625,200" class="arrow"/>
<rect x="345" y="350" width="210" height="95" class="box" fill="#ede9fe"/>
<text x="450.0" y="378" class="label" text-anchor="middle">Linker / Loader</text>
<text x="450.0" y="400" class="tiny" text-anchor="middle">tính địa chỉ cuối cùng</text>
<path d="M450,260 L450,350" class="arrow"/>
<path d="M450,350 L720,250" class="arrow"/>
<text x="65" y="500" class="small" text-anchor="start">Ví dụ: `R_X86_64_JUMP_SLOT` thường dùng cho hàm imported; `R_X86_64_RELATIVE` hay gặp trong PIE/shared library.</text>
</svg>
