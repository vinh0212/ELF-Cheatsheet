<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
  </marker>
  <style>
  .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
  .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
  .label { font: 700 15px Arial, sans-serif; fill: #111827; }
  .small { font: 400 13px Arial, sans-serif; fill: #374151; }
  .tiny { font: 400 12px Arial, sans-serif; fill: #4b5563; }
  .mono { font: 600 13px Consolas, Menlo, monospace; fill: #111827; }
  .box { stroke: #374151; stroke-width: 1.6; rx: 12; ry: 12; }
  .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 6 5; }
</style>
</defs>
<rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
<text x="40" y="42" class="title" text-anchor="start">Hình 8 — Symbol table và string table</text>
<text x="40" y="68" class="subtitle" text-anchor="start">Symbol table lưu metadata; tên symbol thường nằm trong string table và được trỏ bằng offset.</text>
<rect x="70" y="145" width="300" height="260" class="box" fill="#dbeafe"/>
<text x="220.0" y="173" class="label" text-anchor="middle">`.symtab` / `.dynsym`</text>
<text x="100" y="190" class="mono" text-anchor="start">st_name</text>
<text x="220" y="190" class="tiny" text-anchor="start">offset tới chuỗi tên</text>
<text x="100" y="226" class="mono" text-anchor="start">st_info</text>
<text x="220" y="226" class="tiny" text-anchor="start">binding + type</text>
<text x="100" y="262" class="mono" text-anchor="start">st_shndx</text>
<text x="220" y="262" class="tiny" text-anchor="start">section index</text>
<text x="100" y="298" class="mono" text-anchor="start">st_value</text>
<text x="220" y="298" class="tiny" text-anchor="start">địa chỉ/offset</text>
<text x="100" y="334" class="mono" text-anchor="start">st_size</text>
<text x="220" y="334" class="tiny" text-anchor="start">kích thước symbol</text>
<rect x="560" y="145" width="280" height="260" class="box" fill="#dcfce7"/>
<text x="700.0" y="173" class="label" text-anchor="middle">`.strtab` / `.dynstr`</text>
<text x="600" y="195" class="mono" text-anchor="start">0: \0</text>
<text x="600" y="230" class="mono" text-anchor="start">1: main\0</text>
<text x="600" y="265" class="mono" text-anchor="start">6: printf\0</text>
<text x="600" y="300" class="mono" text-anchor="start">13: global_var\0</text>
<text x="600" y="335" class="mono" text-anchor="start">24: libc.so.6\0</text>
<path d="M210,190 L600,230" class="arrow"/>
<text x="255" y="175" class="mono" text-anchor="start">st_name = 6</text>
<text x="80" y="470" class="small" text-anchor="start">`.dynsym` thường nhỏ hơn `.symtab` vì chỉ giữ symbol cần cho dynamic linking.</text>
</svg>
